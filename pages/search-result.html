
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Results | Fatin's Florette</title>

    <link rel="stylesheet" href="../css/search.css">

    <style>
        .search-results-page {
            width: min(1200px, 91%);
            margin: 60px auto;
            min-height: 400px;
        }

        .search-result {
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #f0dce5;
            border-radius: 12px;
        }

        .search-result h2 {
            color: #740043;
            font-family: 'Playfair Display', serif;
        }

        .search-result a {
            color: #740043;
            text-decoration: none;
            font-weight: 600;
        }

        .no-results {
            padding: 30px 0;
            color: #795b68;
        }
    </style>
</head>

<body>

    <main class="search-results-page">

        <p>A LITTLE SOMETHING IN BLOOM</p>

        <h1>Search Results</h1>

        <p id="searchMessage"></p>

        <div id="searchResults"></div>

    </main>

    <script src="../js/search.js"></script>

    <script>

        const params = new URLSearchParams(window.location.search);

        const query = params.get("q") || "";

        const searchTerm = query.toLowerCase().trim();

        const resultsContainer =
            document.getElementById("searchResults");

        const searchMessage =
            document.getElementById("searchMessage");

        searchMessage.textContent =
            `Showing results for "${query}"`;

        const results = websitePages.filter(page => {

            const searchableText = [
                page.title,
                page.description,
                ...page.keywords
            ].join(" ").toLowerCase();

            return searchableText.includes(searchTerm);

        });

        if (results.length > 0) {

            results.forEach(page => {

                const result = document.createElement("div");

                result.className = "search-result";

                result.innerHTML = `
                    <h2>${page.title}</h2>
                    <p>${page.description}</p>
                    <a href="${page.url}">Visit Page →</a>
                `;

                resultsContainer.appendChild(result);

            });

        } else {

            resultsContainer.innerHTML = `
                <div class="no-results">
                    <h2>No results found</h2>
                    <p>Try searching for flowers, delivery,
                    bouquets or other information.</p>
                </div>
            `;

        }

    </script>

</body>
</html>
